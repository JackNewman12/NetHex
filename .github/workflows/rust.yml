name: Rust

on:
  push:
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Test
      run: cargo test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, arm-unknown-linux-musleabihf]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: taiki-e/install-action@v2
      with:
        tool: cross

    - name: Clippy
      run: cross clippy --all-features --target ${{ matrix.target }}

    - name: Build Binary
      run: |
        cross build --target ${{ matrix.target }} --release
        cp target/${{ matrix.target }}/release/nethex nethex-${{ matrix.target }}

    - name: Save Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nethex-${{ matrix.target }}
        path: nethex-${{ matrix.target }}

    - name: Upload binary
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: nethex-${{ matrix.target }}
