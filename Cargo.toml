[package]
name = "nethex"
version = "0.8.4-alpha.1"
authors = ["Jack Newman jacknewman12@gmail.com"]
edition = "2021"
license = "MIT"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hexplay = "0.3.0"
hex = "0.4.3"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
crossbeam-channel = "0.5.17"
log = { version = "0.4.34", features = ["release_max_level_debug"] }
env_logger = "0.11.11"
indicatif = "0.18.6"
pnet = "0.35.0"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = "symbols"
